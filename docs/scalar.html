<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pragati Path API · Scalar Reference</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A1F3A'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' fill='white' text-anchor='middle' font-weight='bold'%3EPP%3C/text%3E%3C/svg%3E" />
  <style>
    body { margin: 0; padding: 0; background: #0A1F3A; }
  </style>
</head>
<body>
  <!--
    Standalone Scalar API Reference for Pragati Path
    --------------------------------------------------
    HOW TO USE
    1) Open this file directly in your browser (double-click). It will load
       openapi.json from the same folder.
    2) Or host this folder on any static server (GitHub Pages, Netlify, S3, etc.)
       and share the URL.
    3) The "Try it" panel on the right lets you fire real requests against the
       configured server. Update the server dropdown to point at production
       (https://pragati-learning-hub.emergent.host) or localhost:8001.
  -->

  <script
    id="api-reference"
    data-url="./openapi.json"
    type="application/json"
    data-configuration='{
      "theme": "purple",
      "layout": "modern",
      "showSidebar": true,
      "hideDownloadButton": false,
      "hideTestRequestButton": false,
      "darkMode": true,
      "metaData": {
        "title": "Pragati Path API · Scalar Reference",
        "description": "Coaching-centre management API. Open in browser to explore all 47 endpoints with interactive Try-it client.",
        "ogTitle": "Pragati Path API"
      },
      "servers": [
        {"url": "https://pragati-learning-hub.emergent.host/api", "description": "Production"},
        {"url": "http://localhost:8001/api", "description": "Local dev"}
      ],
      "authentication": {
        "preferredSecurityScheme": "BearerAuth"
      }
    }'
  ></script>

  <!-- Pinned to a specific Scalar version for stability -->
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.25.65"></script>

  <noscript>
    <div style="padding:40px;color:white;font-family:sans-serif;max-width:600px;margin:0 auto;">
      <h1>Pragati Path API Reference</h1>
      <p>This Scalar viewer requires JavaScript. Alternatively view the raw OpenAPI spec at <a style="color:#FFD43B" href="./openapi.json">openapi.json</a> or browse the markdown docs in the same folder.</p>
    </div>
  </noscript>
</body>
</html>
